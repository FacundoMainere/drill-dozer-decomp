name: Tests

on:
  push:
    paths: ["tools/**", ".github/**", "pool.toml", ".clang-format"]
  pull_request:
    paths: ["tools/**", ".github/**", "pool.toml", ".clang-format"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tools
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
