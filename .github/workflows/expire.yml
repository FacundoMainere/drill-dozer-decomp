# Deletes expired claims, adds strikes and updates docs/PROGRESS.md. The only workflow that
# pushes to main.
name: Expire claims

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/pool.py expire | tee expired.txt
          python3 tools/pool.py progress --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain pool)" ]; then
            git add pool
            git commit -q -m "Expire claims" -m "$(cat expired.txt)"
          fi
          if [ -n "$(git status --porcelain docs/PROGRESS.md)" ]; then
            git add docs/PROGRESS.md
            git commit -q -m "Update progress"
          fi
          # A PR may merge while this runs: rebase onto it once and retry.
          if [ -n "$(git log origin/main..HEAD)" ]; then
            git push || { git pull -q --rebase && git push; }
          fi
      # Tell the dcomp tracker that claims may have expired. Best effort, the tracker also polls. Enabled by the repo variable DCOMP_NOTIFY=true.
      - if: vars.DCOMP_NOTIFY == 'true'
        run: |
          curl -fsS --max-time 10 -X POST -H "Authorization: Bearer $DCOMP_API_KEY" "$DCOMP_SYNC_URL" \
            || echo "::warning::dcomp notification failed; the tracker will catch up on its next poll"
        env:
          DCOMP_API_KEY: ${{ secrets.DCOMP_API_KEY }}
          DCOMP_SYNC_URL: ${{ secrets.DCOMP_SYNC_URL }}
