# Validates claim / release / solve PRs and merges them. Runs the BASE branch's workflow and
# tools (pull_request_target); the PR is only read as git data and never checked out or run.
name: Pool

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.result.outputs.kind }}
      ok: ${{ steps.result.outputs.ok }}
      reason: ${{ steps.result.outputs.reason }}
    env:
      AUTHOR: ${{ github.event.pull_request.user.login }}
      CREATED: ${{ github.event.pull_request.created_at }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A private repo needs the (read-only) job token to fetch the PR. Nothing the PR controls can
      # read .git/config: includes are limited to include/ and the PR is never executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: ${{ github.event.repository.private }}
      # The exact commit this run was triggered for; a later push gets its own run.
      - run: git fetch -q --no-tags origin "$SHA"
      - id: state
        run: |
          python3 tools/pool.py validate --author "$AUTHOR" --created "$CREATED" --ref "$SHA" --state-only > result.json || true
          cat result.json
          echo "kind=$(jq -r .kind result.json)" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r .ok result.json)" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.kind == 'solve' && steps.state.outputs.ok == 'true'
        uses: ./.github/actions/tools
      - if: steps.state.outputs.kind == 'solve' && steps.state.outputs.ok == 'true'
        run: |
          python3 tools/pool.py validate --author "$AUTHOR" --created "$CREATED" --ref "$SHA" > result.json || true
          cat result.json
      - id: result
        run: |
          echo "kind=$(jq -r .kind result.json)" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r .ok result.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -c .reason result.json)" >> "$GITHUB_OUTPUT"

  merge:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      CREATED: ${{ github.event.pull_request.created_at }}
      KIND: ${{ needs.verify.outputs.kind }}
      REASON: ${{ fromJSON(needs.verify.outputs.reason) }}
    steps:
      - if: needs.verify.outputs.kind == 'manual' && github.event.action == 'opened' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        run: gh pr comment "$PR" --repo "$REPO" --body "Not a claim, release or solve PR, so it is not merged automatically. A maintainer will review it. See AGENTS.md."
      - if: needs.verify.outputs.kind != 'manual' && needs.verify.outputs.ok != 'true'
        run: |
          printf 'Rejected (%s):\n\n```\n%s\n```\n\nPush a fix to this PR or close it. See AGENTS.md.\n' "$KIND" "$REASON" > body.md
          gh pr comment "$PR" --repo "$REPO" --body-file body.md
      - if: needs.verify.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: ${{ github.event.repository.private }}
      # Re-check against main as it is now: another PR may have merged since verify started.
      # A merge can also lose a race with a simultaneous one, so retry, re-checking each time.
      - if: needs.verify.outputs.ok == 'true'
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q --no-tags origin "$SHA"
          for attempt in 1 2 3; do
            git fetch -q --no-tags origin "$DEFAULT"
            git reset -q --hard "origin/$DEFAULT"
            python3 tools/pool.py validate --author "$AUTHOR" --created "$CREATED" --ref "$SHA" --state-only > result.json || true
            cat result.json
            if [ "$(jq -r .ok result.json)" != true ]; then
              printf 'Rejected on re-check (%s):\n\n```\n%s\n```\n' "$KIND" "$(jq -r .reason result.json)" > body.md
              gh pr comment "$PR" --repo "$REPO" --body-file body.md
              exit 1
            fi
            if gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA" --subject "$KIND #$PR" --body ""; then
              exit 0
            fi
            [ "$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)" = "$SHA" ] || break
            sleep 15
          done
          gh pr comment "$PR" --repo "$REPO" --body "Could not merge. Either the PR changed after it was verified (the new commit gets its own run), or there is a conflict: someone claimed or solved this function first. In that case sync your fork and pick another function. If neither applies, push an empty commit to retry."
          exit 1
      # Tell the dcomp tracker that main changed (claim, release or solve merged). Best effort:
      # the tracker also polls, so a failed call only delays the update. Enabled by the repo
      # variable DCOMP_NOTIFY=true.
      - if: success() && needs.verify.outputs.ok == 'true' && vars.DCOMP_NOTIFY == 'true'
        run: |
          curl -fsS --max-time 10 -X POST -H "Authorization: Bearer $DCOMP_API_KEY" "$DCOMP_SYNC_URL" \
            || echo "::warning::dcomp notification failed; the tracker will catch up on its next poll"
        env:
          DCOMP_API_KEY: ${{ secrets.DCOMP_API_KEY }}
          DCOMP_SYNC_URL: ${{ secrets.DCOMP_SYNC_URL }}
